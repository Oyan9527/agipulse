name: Update AI signal data

on:
  schedule:
    # ⚠️ GitHub Actions cron 用的是 UTC，不是北京时间！
    # DeepSeek 优惠时段 = 北京时间 00:30–08:30 = UTC 16:30–次日 00:30（此时段 chat 约半价、
    # reasoner 折扣更多；以 DeepSeek 官方公告为准）。两个时间点都排进这个窗口以省钱。
    - cron: "0 17 * * *"   # 主运行：UTC 17:00 = 北京 01:00，每天仅此一次
    - cron: "0 21 * * *"   # 兜底补跑：UTC 21:00 = 北京 05:00，仅当主运行没把数据跑出来时才真跑（见 decide job）
    # ⏱ 实测 GitHub 对定时任务有 2.5~4 小时排队延迟：17:00 这条常在 21:4x 才起，
    #    21:00 这条常落到次日 01:0x——后者已经越过优惠时段的尾巴(UTC 00:30)。
    #    补跑属于异常路径、平时不该触发，所以没为此把时间提前（提前了反而可能
    #    赶在主运行之前执行，查不到主运行的结果，照样白跑）。
  workflow_dispatch: {}    # 支持手动触发（首次部署 / 想临时补一轮），手动触发一律直接跑

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read    # decide job 要查本 workflow 当天的运行结果，判断主运行是否已成功

jobs:
  # 「失败才补跑」的闸门：GitHub cron 本身没有"上一次失败才触发"的能力，
  # 只能让 21 点这轮照常被唤醒，然后在这里回看最近一段时间主运行的结果，自行决定要不要干活。
  # 判据用的是 Actions 自身的运行记录（而非"今天有没有数据提交"）——因为流水线
  # 成功但当轮没有新内容时是不产生提交的，用提交判断会把这种正常情况误当失败而白跑一轮。
  # 三种情况都会补跑：主运行失败 / 被取消 / GitHub 高负载时压根没触发（scheduled run 会被丢弃）。
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether to run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 手动触发、或主运行(17点)这一轮：无条件跑
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "主运行或手动触发 -> 执行"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 21 点这轮：回看最近 12 小时，主运行有没有真的把数据产出来。
          #
          # 判据不能用整个 run 的 conclusion。最后那步 Health check 是"信源体检"，
          # 它红了代表某类信源挂了（比如 reddit 整类被 429），可数据本身早就抓完、
          # 提交完了。用 run 的红绿判断，会把这种情况当成"主运行失败"天天补跑一轮
          # ——线上实测连续 8 次定时运行都是这么红的，等于每天白烧一次 DeepSeek，
          # 正好和这套「失败才补跑」省钱的初衷反着来。
          #
          # 所以只认 update-data 里这两步：Run pipeline(数据生成) 和
          # Commit data if changed(数据落库)。两步都成功 = 当天的活已经干完了。
          # 窗口用"最近 12 小时"，不是"UTC 当天"。
          #
          # 原先按自然日筛，线上实测 GitHub 的定时触发要延迟 2.5~4 小时：17:00 那条
          # 落到 21:4x（还是同一天），21:00 这条落到次日 01:0x——跨过了午夜，于是
          # 「查当天」把几小时前刚跑完的主运行漏在了昨天，每晚照旧白跑一轮完整流水线。
          # 2026-10-08 那两轮就是这么回事：21:49 的数据步骤全绿，01:02 仍然跑了全套。
          #
          # 12 小时这个数要落在 (两条 cron 的实际间隔, 24h - 延迟波动) 之间：实际间隔
          # 约 3~4 小时，上一天的同一轮在 24 小时前，取 12 小时两头都够不着。
          since=$(date -u -d "12 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "回看窗口起点: ${since}"
          ids=$(gh run list --workflow pipeline.yml --event schedule --limit 20 \
                  --json databaseId,createdAt \
                  --jq "[.[] | select(.createdAt >= \"${since}\")] | .[].databaseId")

          done_ok=0
          for id in ${ids}; do
            n=$(gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" \
                  --jq '[.jobs[] | select(.name == "update-data") | .steps[]
                         | select(.name == "Run pipeline" or .name == "Commit data if changed")
                         | select(.conclusion == "success")] | length')
            echo "run ${id}: 关键步骤成功数 ${n}/2"
            if [ "${n}" -ge 2 ]; then done_ok=1; break; fi
          done

          if [ "${done_ok}" -eq 1 ]; then
            echo "当天数据已成功产出 -> 跳过补跑，省一次 DeepSeek 调用"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "当天还没有一轮把数据跑出来 -> 执行补跑"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update-data:
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 先跑测试再抓取：坏掉的过滤/合并/URL 校验逻辑会把脏数据写进 docs/data 并提交，
      # 而这些问题在页面上往往没有症状（比如 XSS 防线失效），等发现就晚了。
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m scripts.run_pipeline --output-dir docs/data

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/feed.xml
          if git diff --cached --quiet; then
            echo "no data changes, skipping commit"
            exit 0
          fi
          git commit -m "data: update feeds @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 跑流水线期间若有人往 main 推了提交，直接 push 会因 non-fast-forward 被拒，
          # 本轮抓到的数据就白白丢了。失败则 rebase 到最新 main 后重试。
          # 冲突只会出现在 docs/data（全量重写的快照），-X theirs 在 rebase 语境下
          # 指的是"正在应用的提交"，也就是本轮刚生成的数据——取新不取旧。
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $attempt)"
            git fetch origin main || { echo "fetch failed, retrying"; continue; }
            git rebase --strategy-option=theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # 放在提交之后：数据永远先落盘、先推送。这一步只在检测到静默失效（大批源挂掉 /
      # DeepSeek 失效）时非零退出，让本次 job 标红并给仓库 owner 发失败邮件。
      # if: always() 确保即使前面某步失败也照样体检，不被跳过。
      - name: Health check
        if: always()
        run: python -m scripts.health_check --data-dir docs/data
