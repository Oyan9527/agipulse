name: Update AI signal data

on:
  schedule:
    # ⚠️ GitHub Actions cron 用的是 UTC，不是北京时间！
    # DeepSeek 优惠时段 = 北京时间 00:30–08:30 = UTC 16:30–次日 00:30（此时段 chat 约半价、
    # reasoner 折扣更多；以 DeepSeek 官方公告为准）。两个时间点都排进这个窗口以省钱。
    - cron: "0 17 * * *"   # 主运行：UTC 17:00 = 北京 01:00，每天仅此一次
    - cron: "0 21 * * *"   # 兜底补跑：UTC 21:00 = 北京 05:00，仅当当天主运行没成功时才真跑（见 decide job）
  workflow_dispatch: {}    # 支持手动触发（首次部署 / 想临时补一轮），手动触发一律直接跑

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read    # decide job 要查本 workflow 当天的运行结果，判断主运行是否已成功

jobs:
  # 「失败才补跑」的闸门：GitHub cron 本身没有"上一次失败才触发"的能力，
  # 只能让 21 点这轮照常被唤醒，然后在这里查当天主运行的结果自行决定要不要干活。
  # 判据用的是 Actions 自身的运行记录（而非"今天有没有数据提交"）——因为流水线
  # 成功但当轮没有新内容时是不产生提交的，用提交判断会把这种正常情况误当失败而白跑一轮。
  # 三种情况都会补跑：主运行失败 / 被取消 / GitHub 高负载时压根没触发（scheduled run 会被丢弃）。
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether to run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 手动触发、或主运行(17点)这一轮：无条件跑
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "主运行或手动触发 -> 执行"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 21 点这轮：查当天(UTC)是否已经有一次成功的定时运行
          today=$(date -u +%F)
          ok=$(gh run list --workflow pipeline.yml --event schedule --limit 20 \
                 --json conclusion,createdAt \
                 --jq "[.[] | select(.createdAt >= \"${today}T00:00:00Z\") | select(.conclusion == \"success\")] | length")
          echo "当天已成功的定时运行次数: ${ok}"
          if [ "${ok}" -gt 0 ]; then
            echo "主运行当天已成功 -> 跳过补跑，省一次 DeepSeek 调用"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "当天尚无成功运行 -> 执行补跑"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update-data:
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 先跑测试再抓取：坏掉的过滤/合并/URL 校验逻辑会把脏数据写进 docs/data 并提交，
      # 而这些问题在页面上往往没有症状（比如 XSS 防线失效），等发现就晚了。
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m scripts.run_pipeline --output-dir docs/data

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/feed.xml
          if git diff --cached --quiet; then
            echo "no data changes, skipping commit"
            exit 0
          fi
          git commit -m "data: update feeds @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 跑流水线期间若有人往 main 推了提交，直接 push 会因 non-fast-forward 被拒，
          # 本轮抓到的数据就白白丢了。失败则 rebase 到最新 main 后重试。
          # 冲突只会出现在 docs/data（全量重写的快照），-X theirs 在 rebase 语境下
          # 指的是"正在应用的提交"，也就是本轮刚生成的数据——取新不取旧。
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $attempt)"
            git fetch origin main || { echo "fetch failed, retrying"; continue; }
            git rebase --strategy-option=theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # 放在提交之后：数据永远先落盘、先推送。这一步只在检测到静默失效（大批源挂掉 /
      # DeepSeek 失效）时非零退出，让本次 job 标红并给仓库 owner 发失败邮件。
      # if: always() 确保即使前面某步失败也照样体检，不被跳过。
      - name: Health check
        if: always()
        run: python -m scripts.health_check --data-dir docs/data
